<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You've been invited to Mindcast</title>
</head>
<body style="margin:0; padding:0; background:#F8F5EF; font-family:Arial, Helvetica, sans-serif; color:#303947;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#F8F5EF; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px; background:#FFFFFF; border-radius:20px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="background:#3D8DB7; padding:34px 30px;">
              <img src="https://www.mindcast.co.nz/brand/mindcast-wordmark-white.png" alt="Mindcast" width="150" style="display:block; width:150px; height:auto; border:0; outline:none;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:36px 40px;">
              <h1 style="margin:0 0 16px; font-size:22px; line-height:1.3; color:#102438;">Set up your Mindcast account</h1>
              <p style="margin:0 0 28px; font-size:15px; line-height:1.6; color:#303947;">
                You've been added to your family's Mindcast household. Set up your account and choose your password to get started.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:#3D8DB7; color:#FFFFFF; text-decoration:none; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; padding:14px 30px; border-radius:6px;">Set up my account</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:0 40px 36px;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#8A8574;">
                If you didn't expect this, you can safely ignore this email.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
