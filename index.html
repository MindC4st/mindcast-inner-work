<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- This head is the TEMPLATE. scripts/prerender-seo.mjs rewrites title,
         description, canonical and the og:/twitter: pairs per route after the
         build, from the table in src/lib/seo.ts. Edit the copy there, not
         here, or the two will disagree. -->
    <title>Mindcast — A Weekly Gathering Without the Religion</title>
    <meta name="description" content="Everything church did well — a room, the same people, every week, a shared idea to carry home — without the religion. Adults, teens and children in Taupō, New Zealand.">
    <link rel="canonical" href="https://www.mindcast.co.nz">
    <meta name="author" content="Mindcast" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3585af" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mindcast" />
    <meta property="og:locale" content="en_NZ" />
    <meta property="og:url" content="https://www.mindcast.co.nz">
    <meta property="og:image" content="https://pjyelgogdsuiugaudecc.supabase.co/storage/v1/object/public/assets/ogimage.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mindcastnz" />
    <meta name="twitter:image" content="https://pjyelgogdsuiugaudecc.supabase.co/storage/v1/object/public/assets/ogimage.png">
    <meta property="og:title" content="Everything church did well. Without the religion.">
    <meta name="twitter:title" content="Everything church did well. Without the religion.">
    <meta property="og:description" content="Everything church did well — a room, the same people, every week, a shared idea to carry home — without the religion. Adults, teens and children in Taupō, New Zealand.">
    <meta name="twitter:description" content="Everything church did well — a room, the same people, every week, a shared idea to carry home — without the religion. Adults, teens and children in Taupō, New Zealand.">

    <!-- Organisation identity for the knowledge panel and rich results.
         `Organization`, deliberately — not MedicalOrganization, HealthClub or
         any of the health types. Mindcast is a community organisation, and
         claiming a clinical schema type would assert something untrue about
         what happens in the room. -->
    <!-- TODO: replace with a purpose-built 1200x630 social card. The current
         file is a square PWA icon, which most unfurlers letterbox or crop. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.mindcast.co.nz/#organization",
          "name": "Mindcast",
          "url": "https://www.mindcast.co.nz",
          "logo": "https://pjyelgogdsuiugaudecc.supabase.co/storage/v1/object/public/assets/wordmark-blue-bluemic-transparent.png",
          "description": "A weekly facilitated community gathering in Taupō, New Zealand, with separate sessions for adults, teens and children. Secular and non-religious.",
          "areaServed": { "@type": "Place", "name": "Taupō, New Zealand" },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Taupō",
            "addressRegion": "Waikato",
            "addressCountry": "NZ"
          },
          "knowsAbout": [
            "Secular community",
            "Non-religious Sunday gathering",
            "Personal development",
            "Weekly community gathering",
            "Family community programmes"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.mindcast.co.nz/#website",
          "url": "https://www.mindcast.co.nz",
          "name": "Mindcast",
          "publisher": { "@id": "https://www.mindcast.co.nz/#organization" },
          "inLanguage": "en-NZ"
        }
      ]
    }
    </script>

    <link rel="icon" type="image/png" href="https://pjyelgogdsuiugaudecc.supabase.co/storage/v1/object/public/assets/favicon.png">
    <link rel="apple-touch-icon" href="https://pjyelgogdsuiugaudecc.supabase.co/storage/v1/object/public/assets/pwa.png">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
