<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Mindcast</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #fffaf6; color: #1a2b3c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 2rem;
      }
      .box { max-width: 20rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; letter-spacing: .02em; }
      p { color: #55677a; font-size: .9rem; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        background: #3585af; color: #fff; border: 0; border-radius: 4px;
        padding: .6rem 1.4rem; font-size: .8rem; letter-spacing: .1em;
        text-transform: uppercase; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You're offline</h1>
      <p>Mindcast needs a connection for live sessions and your coursebook. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
